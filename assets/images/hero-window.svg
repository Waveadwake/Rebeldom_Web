<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920" role="img" aria-labelledby="title desc">
  <title id="title">一扇朝向山野的拱窗</title>
  <desc id="desc">暖色纸张上的拱形窗景，窗外有落日、远山与一条蜿蜒的小路，带有纸张颗粒和手写刊物式的标注。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ddb9"/>
      <stop offset="0.58" stop-color="#edc49b"/>
      <stop offset="1" stop-color="#e4ad86"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ce6b48"/>
      <stop offset="0.76" stop-color="#c25f3f"/>
      <stop offset="1" stop-color="#b65335"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ca187"/>
      <stop offset="1" stop-color="#7d8971"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#71816a"/>
      <stop offset="1" stop-color="#526757"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#405746"/>
      <stop offset="1" stop-color="#273b30"/>
    </linearGradient>
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
    <clipPath id="archClip">
      <path d="M110 806V390C110 214 231 92 380 92s270 122 270 298v416Z"/>
    </clipPath>
  </defs>

  <!-- Paper ground -->
  <rect width="760" height="920" fill="#e7decd"/>
  <rect x="28" y="28" width="704" height="864" fill="none" stroke="#24352b" stroke-opacity=".22"/>

  <!-- Catalogue marks -->
  <g fill="#314138" font-family="'Cascadia Mono', Consolas, monospace" font-size="9" letter-spacing="2.4">
    <text x="52" y="66">FIELD NOTES / NO. 07</text>
    <text x="708" y="66" text-anchor="end">HANGZHOU · AUTUMN</text>
  </g>
  <path d="M52 79h74" stroke="#b65335" stroke-width="1.4"/>

  <!-- Arch window -->
  <path d="M110 806V390C110 214 231 92 380 92s270 122 270 298v416Z" fill="#f7f0e2" stroke="#24352b" stroke-width="1.8"/>

  <g clip-path="url(#archClip)">
    <!-- Sky -->
    <rect x="110" y="92" width="540" height="714" fill="url(#sky)"/>

    <!-- Sun -->
    <circle cx="502" cy="306" r="116" fill="#d17b57" opacity=".18"/>
    <circle cx="502" cy="306" r="91" fill="url(#sunGlow)"/>

    <!-- Thin cloud lines -->
    <g stroke="#f7ead4" stroke-linecap="round">
      <path d="M188 270h126" stroke-width="2" opacity=".55"/>
      <path d="M215 282h75" stroke-width="1.3" opacity=".4"/>
      <path d="M530 402h68" stroke-width="1.3" opacity=".35"/>
      <path d="M552 413h36" stroke-width="1.1" opacity=".28"/>
    </g>

    <!-- Birds -->
    <g fill="none" stroke="#435548" stroke-width="1.5" stroke-linecap="round">
      <path d="M261 222c5-5 9-5 13 0 4-5 8-5 13 0"/>
      <path d="M314 193c3-3 6-3 8 0 3-3 6-3 8 0" opacity=".72"/>
      <path d="M581 245c4-4 7-4 10 0 4-4 7-4 10 0" opacity=".55"/>
    </g>

    <!-- Distant hills -->
    <path d="M110 489c56-35 117-45 180-15 42-36 105-44 155-5 48-36 111-29 155 11v326H110Z" fill="url(#hillFar)" opacity=".9"/>
    <path d="M110 548c63-39 129-42 194 1 54-33 111-39 164 2 45-22 86-21 122-1v256H110Z" fill="url(#hillMid)"/>

    <!-- Winding path -->
    <path d="M330 806c9-53 34-92 69-128 37-38 54-77 48-124 15-11 30-9 41 5-32 44-23 88-57 128-40 47-48 73-52 119Z" fill="#d7c8ae"/>
    <path d="M356 806c12-45 37-77 67-108 34-35 47-70 46-110" fill="none" stroke="#b8a98f" stroke-width="1.1" stroke-dasharray="2 8" stroke-linecap="round"/>

    <!-- Near hill -->
    <path d="M110 689c65-49 141-64 215-29 49-34 109-40 166-9 45-29 101-26 159 12v143H110Z" fill="url(#hillNear)"/>

    <!-- Tree on the left -->
    <g stroke="#2b4033" stroke-linecap="round">
      <path d="M226 723c9-47 9-96 5-153" fill="none" stroke-width="3.4"/>
      <path d="M229 629c-20-23-38-33-57-40M229 658c22-27 41-39 63-48M228 603c-7-28-2-50 8-67M230 674c-18-14-34-20-50-24" fill="none" stroke-width="1.6"/>
    </g>
    <g fill="#324938">
      <ellipse cx="171" cy="584" rx="41" ry="19" opacity=".8"/>
      <ellipse cx="290" cy="602" rx="46" ry="17" opacity=".7"/>
      <ellipse cx="206" cy="556" rx="29" ry="13" opacity=".65"/>
      <ellipse cx="259" cy="543" rx="23" ry="11" opacity=".55"/>
      <ellipse cx="247" cy="621" rx="22" ry="9" opacity=".55"/>
    </g>

    <!-- Foreground stems -->
    <g fill="none" stroke="#1f3127" stroke-linecap="round" opacity=".72">
      <path d="M462 806c-2-33 1-58 10-77M473 788c8-10 16-15 24-19M470 766c-9-9-14-17-17-26" stroke-width="1.4"/>
      <path d="M511 806c-4-24-3-43 4-57M516 776c7-6 13-9 19-11" stroke-width="1.2"/>
      <path d="M620 806c-4-26-2-45 6-60M631 771c7-7 14-11 22-14" stroke-width="1.2"/>
      <path d="M153 806c1-24 6-41 15-54M165 782c9-5 16-7 23-8" stroke-width="1.2"/>
    </g>

    <!-- Light falling across the room -->
    <path d="M110 806V390c0-176 121-298 270-298v714Z" fill="#fff7e6" opacity=".045"/>
    <path d="M555 92h95v714h-95Z" fill="#fff4dd" opacity=".03"/>
  </g>

  <!-- Interior arch shadow -->
  <path d="M110 806V390C110 214 231 92 380 92s270 122 270 298v416" fill="none" stroke="#24352b" stroke-width="1.8"/>
  <path d="M124 806V393C124 224 239 106 380 106s256 118 256 287v413" fill="none" stroke="#fff8e9" stroke-opacity=".36"/>

  <!-- Window sill -->
  <path d="M91 806h578" stroke="#24352b" stroke-width="2.4"/>
  <path d="M102 813h558" stroke="#24352b" stroke-opacity=".32"/>

  <!-- Small seal -->
  <g transform="translate(633 824)">
    <rect width="42" height="42" fill="#b65335"/>
    <text x="21" y="29" text-anchor="middle" fill="#f7f0e2" font-family="'Songti SC', 'SimSun', serif" font-size="21">缓</text>
  </g>

  <!-- Footer notation -->
  <g fill="#435147" font-family="'Cascadia Mono', Consolas, monospace" font-size="8.5" letter-spacing="1.7">
    <text x="52" y="859">A STUDY OF SLOW AFTERNOONS</text>
    <text x="52" y="874" fill="#7f887f">READ, WALK, AND NOTICE.</text>
  </g>

  <!-- Subtle paper grain -->
  <rect width="760" height="920" filter="url(#paperGrain)" opacity=".065" style="mix-blend-mode:multiply"/>
</svg>
