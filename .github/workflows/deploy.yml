name: Deploy blog to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  guard:
    name: Check repository contents
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Block private or accidental files
        run: bash .githooks/check-repo.sh --tree

  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    needs: guard
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble public site from allowlist
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Only these public entry files are ever published.
          for file in index.html posts.html about.html 404.html feed.xml sitemap.xml robots.txt site.webmanifest; do
            test -f "$file"
            cp "$file" _site/
          done

          # Public content directories.
          cp -R assets post _site/

          # GitHub Pages metadata.
          cp .nojekyll _site/.nojekyll
          if [ -f CNAME ]; then
            cp CNAME _site/CNAME
          fi

          echo "Files included in the Pages artifact:"
          find _site -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
