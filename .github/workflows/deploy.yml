name: Deploy blog to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate site files
        id: site
        shell: bash
        run: |
          if [ -f "index.html" ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
            echo "Site found at repository root."
          elif [ -f "web/index.html" ]; then
            echo "path=web" >> "$GITHUB_OUTPUT"
            echo "Site found in web/."
          else
            echo "::error::Could not find index.html at the repository root or in web/."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
